[project]
name = "tfs"
version = "0.1.0"
description = "The Filipino Standard — automated research, scripting, production and publishing pipeline"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8",
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dotenv>=1",
  "requests>=2.32",
  "feedparser>=6",
  "beautifulsoup4>=4.12",
  "pillow>=10",
  "google-genai>=1.30",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "boto3>=1.34",
  "tzdata>=2024.1",
  "truststore>=0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
dev = ["pytest>=8"]

[project.scripts]
tfs = "tfs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
