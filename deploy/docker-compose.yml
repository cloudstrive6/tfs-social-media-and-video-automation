# Lives on the cloud VM at /opt/tfs (copied there by the deploy workflow).
services:
  tfs:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro        # written from GitHub secrets on every deploy
      - tfs-data:/data             # SQLite state, renders, analyst notes (backed up nightly to R2)
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
volumes:
  tfs-data:
