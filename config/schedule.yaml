# When things post. Every platform of a kind posts at the SAME moment (owner's choice, 28 Sep 2026).
#
# Times are Asia/Manila (PHT, UTC+8) and stay fixed to the Philippine audience all year. In New Zealand that
# is +5 h while NZ is on daylight time (late Sep - early Apr) and +4 h the rest of the year:
#
#   kind       PHT      NZ (NZDT, +5h)   NZ (NZST, +4h)
#   vertical   04:30    09:30            08:30
#   carousel   08:30    13:30            12:30
#   vertical   12:30    17:30            16:30
#   carousel   19:00    00:00 (+1 day)   23:00
#   vertical   20:30    01:30 (+1 day)   00:30 (+1 day)
#   long_form  21:00    02:00 (+1 day)   01:00 (+1 day)
#
# Verticals run every 8 hours, 4 hours either side of the morning carousel.
# The weekly analyst can move these times (per kind) from real analytics; see `tfs analyze`.

production_lead_hours: 6      # everything is rendered at least this long before its slot

slots:
  long_form: ["21:00"]
  vertical: ["04:30", "12:30", "20:30"]
  carousel: ["08:30", "19:00"]

platforms:
  long_form: [youtube]
  vertical: [youtube_shorts, instagram_reel, facebook_reel, tiktok]
  # tiktok_carousel = a TikTok photo post (via Post for Me); threads_carousel = Threads (direct API)
  carousel: [instagram_carousel, facebook_post, tiktok_carousel, threads_carousel]

# Pieces made per day (one per slot above).
daily_production:
  long_form: 1
  vertical: 3
  carousel: 2
