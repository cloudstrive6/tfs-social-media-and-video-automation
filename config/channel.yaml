# Brand + model settings shared by every agent.
channel:
  name: The Filipino Standard
  handle: "@TheFilipinoStandard"
  series_tag: "Standard Issue"          # said after every cold open: "Standard Issue #42."
  language: taglish                     # narration (spoken) language: taglish | tagalog | english
  text_language: english                # everything WRITTEN: descriptions, captions, carousels, cards, thumbnails
  timezone: Asia/Manila
  links:
    youtube: https://www.youtube.com/@TheFilipinoStandard
    facebook: https://www.facebook.com/TheFilipinoStandard/
    instagram: https://www.instagram.com/thefilipinostandard
    tiktok: ""                          # add later

pillars:                                # target share of the weekly slate
  now_explained: 0.40
  how_it_works: 0.45                    # style v2: one rule or system (Know Your Government, Built to Fail)
  myths_factchecks: 0.15

# Claude. backend: claude_code = Claude Max subscription via the Claude Code CLI (CLAUDE_CODE_OAUTH_TOKEN);
# api = Console API key (ANTHROPIC_API_KEY). With claude_code, an API key (if set) is used only as a
# fallback when the subscription's usage window runs out.
# Switching the high-volume agents to claude-sonnet-5 stretches the subscription's limits (or cuts API cost ~60%).
llm:
  backend: claude_code
  default_model: claude-opus-5
  agents:
    trend_scout:      {model: claude-opus-5, effort: medium}
    editor_in_chief:  {model: claude-opus-5, effort: high}
    researcher:       {model: claude-opus-5, effort: high}
    scriptwriter:     {model: claude-opus-5, effort: high}
    hook_master:      {model: claude-opus-5, effort: high}
    fact_checker:     {model: claude-opus-5, effort: high}
    title_writer:     {model: claude-opus-5, effort: medium}
    thumbnail_artist: {model: claude-opus-5, effort: medium}
    seo_writer:       {model: claude-opus-5, effort: medium}
    analyst:          {model: claude-opus-5, effort: high}
    audio_qa:         {model: claude-opus-5, effort: medium}
    narration_editor: {model: claude-opus-5, effort: medium}
    visual_qa:        {model: claude-opus-5, effort: high}
    atlas_designer:   {model: claude-opus-5, effort: high}
    creative_director: {model: claude-opus-5, effort: high}

# Quality gates: a slot is SKIPPED rather than filled with a weak piece.
quality:
  min_hook_score: 8          # hook_master self-score out of 10
  min_script_score: 8
  # Fully automated: no human approval step. Unproven allegations are rewritten to roles by the fact-checker;
  # anything that still names a living person over an unproven allegation is skipped automatically.
  require_human_approval_for: []
  # Review team: after rendering and before scheduling, Whisper checks the narration against the script
  # and Visual QA looks at a frame from every shot. Blocking problems are fixed (new image / re-voice /
  # re-render) up to max_fix_rounds times; if one still remains, the piece is skipped.
  review:
    enabled: true
    max_fix_rounds: 2
    min_appeal: 7             # a piece that passes but scores below this gets one polish pass (kept only if better)
    polish_max_frames: 5      # at most this many slides/scenes are reworked in a polish pass
    whisper_model: small      # faster-whisper model (tiny/base/small/medium); small handles Taglish well on CPU
    whisper_language: tl
    min_scene_match: 0.8      # scenes below this word match go to the Proofreader judge
    max_frames: 48            # long-form: frames sampled across the video
    frames_per_call: 12

# Who publishes. direct = our own API access:
#   YouTube + Shorts -> Google Cloud project "tfs-automation" (YouTube Data API)
#   Facebook + Instagram -> Meta app "TFS Content Creator" (Graph API, Development mode)
# postforme = Post for Me, used only for TikTok (its approved TikTok app posts publicly without our own audit).
publishing:
  provider: direct
  overrides:
    tiktok: postforme
    tiktok_carousel: postforme

tts:
  provider: voxcpm            # the VoxCPM2 narrator (the only voice since 2026-11-25)
  # hybrid (Bryce, 2026-11-24): the local RTX 3080 worker (tools/voice_worker.py) narrates first; Modal only after the
  # deadline (slot minus local_until_hours_before_slot) or for lines the worker did not get right. Samples skip the wait.
  voxcpm: {mode: hybrid, takes: 1, seed: 19, threshold: 0.85, local_until_hours_before_slot: 5}

video:
  # The atlas engine (style v2, approved 2026-11-24): paper map, real b-roll, documents, cards, Blender hero,
  # synthesized SFX, animated with GSAP and rendered by HyperFrames.
  engine: atlas
  fps_vector: 60              # every format renders at 60 fps
  render_workers: 4           # parallel Chrome capture workers (GitHub runners have 4 vCPUs)
  long_form: {width: 1920, height: 1080, fps: 60, target_minutes: [8, 15]}
  vertical:  {width: 1080, height: 1920, fps: 60, target_seconds: [35, 58]}
  font: assets/fonts/Anton-Regular.ttf
  caption_font: assets/fonts/Montserrat-ExtraBold.ttf
