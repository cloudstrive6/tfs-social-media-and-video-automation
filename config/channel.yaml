# Brand + model settings shared by every agent.
channel:
  name: The Filipino Standard
  handle: "@TheFilipinoStandard"
  narrator_persona: Kuya Standard
  series_tag: "Standard Issue"          # said after every cold open: "Standard Issue #42."
  language: taglish                     # taglish | tagalog | english
  timezone: Asia/Manila
  links:
    youtube: https://www.youtube.com/@TheFilipinoStandard
    facebook: https://www.facebook.com/TheFilipinoStandard/
    instagram: https://www.instagram.com/thefilipinostandard
    tiktok: ""                          # add later

pillars:                                # target share of the weekly slate
  now_explained: 0.35
  history_retold: 0.30
  why_were_like_this: 0.20
  myths_factchecks: 0.15

# Claude. backend: claude_code = Claude Max subscription via the Claude Code CLI (CLAUDE_CODE_OAUTH_TOKEN);
# api = Console API key (ANTHROPIC_API_KEY). With claude_code, an API key (if set) is used only as a
# fallback when the subscription's usage window runs out.
# Switching the high-volume agents to claude-sonnet-5 stretches the subscription's limits (or cuts API cost ~60%).
llm:
  backend: claude_code
  default_model: claude-opus-5
  agents:
    trend_scout:      {model: claude-opus-5, effort: medium}
    editor_in_chief:  {model: claude-opus-5, effort: high}
    researcher:       {model: claude-opus-5, effort: high}
    scriptwriter:     {model: claude-opus-5, effort: high}
    hook_master:      {model: claude-opus-5, effort: high}
    fact_checker:     {model: claude-opus-5, effort: high}
    title_writer:     {model: claude-opus-5, effort: medium}
    thumbnail_artist: {model: claude-opus-5, effort: medium}
    seo_writer:       {model: claude-opus-5, effort: medium}
    visual_director:  {model: claude-opus-5, effort: medium}
    carousel_designer: {model: claude-opus-5, effort: medium}
    analyst:          {model: claude-opus-5, effort: high}

# Quality gates: a slot is SKIPPED rather than filled with a weak piece.
quality:
  min_hook_score: 8          # hook_master self-score out of 10
  min_script_score: 8
  # Fully automated: no human approval step. Unproven allegations are rewritten to roles by the fact-checker;
  # anything that still names a living person over an unproven allegation is skipped automatically.
  require_human_approval_for: []

# Who publishes. direct = our own API access:
#   YouTube + Shorts -> Google Cloud project "tfs-automation" (YouTube Data API)
#   Facebook + Instagram -> Meta app "TFS Content Creator" (Graph API, Development mode)
# postforme = Post for Me, used only for TikTok (its approved TikTok app posts publicly without our own audit).
publishing:
  provider: direct
  overrides:
    tiktok: postforme

tts:
  provider: elevenlabs        # elevenlabs | fishaudio
  elevenlabs:
    model_id: eleven_v3                   # expressive reads + [laugh]/[sarcastic] tags; eleven_multilingual_v2 = steadier fallback
    voice_id: ""                          # ELEVENLABS_VOICE_ID = oqlKKpA3VREaqVHQKHNn ("Josh - Natural Narrator", Filipino)
    stability: 0.38
    similarity_boost: 0.8
    style: 0.35
    speed: 1.04
  fishaudio:
    reference_id: ""                      # set in .env (FISH_AUDIO_VOICE_ID)
    model: s1

images:
  provider: gemini            # gemini | openai
  gemini_model: gemini-2.5-flash-image
  openai_model: gpt-image-1
  # Shared by every style: palette, recurring cast, hard rules.
  base: >-
    The Filipino Standard visual identity: colour accents of royal blue #0038A8, red #CE1126 and sun yellow
    #FCD116 against deep ink-navy shadows (use them as colours only; draw a Philippine flag only when the scene
    genuinely needs one, and never in scenes set before 1898). Every person is drawn in the channel's simplified
    round-headed cartoon design with dot eyes; no realistic human faces. Recurring cast when relevant: Kuya Standard (calm,
    witty narrator, round head, rolled-up barong sleeves), Juan (confused everyman, round head, plain
    shirt, tsinelas), Tito Trapo (fictional corrupt politician archetype: round head, slicked hair, tight
    barong, sash, gold watch, too-wide grin). No text, letters, captions, logos or watermarks in the image.
  never: >-
    photorealistic images of real, identifiable people; the face or likeness of any real politician or public
    official (represent them only as a labelled silhouette or the fictional Tito Trapo archetype); gore;
    disrespect to the flag, religion, regions or ethnic groups; AI-drawn text or lettering
  # One visual language per job. The Visual Director picks a style for every scene.
  styles:
    story: >-
      Painterly 2D cartoon in the style of premium animated history explainers: thick dark ink outlines,
      soft painted shading, subtle halftone texture, slight chromatic aberration, cinematic lighting with one
      warm key light against a dark cool background. Simple round-headed characters with dot eyes and one
      strong, readable expression. Rich Philippine setting details.
    satire: >-
      Filipino broadsheet editorial cartoon: bold pen-and-ink linework with crosshatching, limited palette of
      ink black plus red and sun-yellow accents on off-white newsprint; every character is a round-headed
      channel-style cartoon archetype (never a realistic or caricatured real face), symbolic props carrying the joke (money bags, hard hats, empty dikes, red tape), dry
      visual irony, generous negative space where our own caption will be added.
    comic: >-
      Comic-strip panel: clean inked outlines, flat bright colours with halftone shading, dynamic camera
      angle, exaggerated comedic acting by the channel's round-headed cast, clear empty space at the top for a speech bubble we add later
      (never draw the bubble or any text).
    archival: >-
      Vintage 19th/early-20th-century illustration: hand-coloured lithograph or sepia oil-painting look, aged
      paper texture, subtle foxing and vignette, period-accurate Philippine clothing and architecture
      (Spanish colonial, American era) or grainy 1970s poster tones for Martial Law scenes. Characters keep
      the round-headed channel design, rendered in the period technique.
  style_prompt: >-
    Mix of styles chosen per scene: story (painterly cartoon, default), satire (editorial pen-and-ink
    cartoon for political commentary), comic (skit panels), archival (period illustration for history).
    Maps are never AI-drawn: use a `map` card. No text in images.

video:
  long_form: {width: 1920, height: 1080, fps: 30, target_minutes: [10, 16]}
  vertical:  {width: 1080, height: 1920, fps: 30, target_seconds: [35, 58]}
  seconds_per_image: 6        # Ken-Burns shot length; lower = more images = more cost
  music_dir: assets/music     # royalty-free beds (YouTube Audio Library / Epidemic etc.)
  music_volume_db: -24
  font: assets/fonts/Anton-Regular.ttf
  caption_font: assets/fonts/Montserrat-ExtraBold.ttf
