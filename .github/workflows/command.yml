# Remote control from the GitHub website or mobile app (Actions -> command -> Run workflow):
# approve / reject a legal-review item, retry a failed post, check status, force a stage.
name: command
on:
  workflow_dispatch:
    inputs:
      command:
        description: "e.g. status | approve 2026-09-28-long0 | reject <id> | retry 12 | requeue <id> | scout | plan"
        required: true
        default: status
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run on the VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          CMD: ${{ inputs.command }}
        run: |
          if ! [[ "$CMD" =~ ^(status|scout|plan|(approve|reject|requeue|produce)\ [0-9a-z-]+|retry\ [0-9]+)$ ]]; then
            echo "command not allowed: $CMD"; exit 1
          fi
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cd /opt/tfs && docker compose exec -T tfs python -m tfs.cli $CMD"
