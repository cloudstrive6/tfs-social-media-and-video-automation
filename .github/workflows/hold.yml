# Actions -> hold -> Run workflow: stop posts that haven't gone live yet (nothing is deleted).
# Leave item blank to hold everything, or paste one item id from the Telegram "Ready" message.
name: hold
on:
  workflow_dispatch:
    inputs:
      item:
        description: item id to pull (blank = everything not yet live)
        required: false
        default: ""
concurrency:
  group: tfs-state          # same group as `run`: never touches the state at the same time
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      command: hold ${{ inputs.item }}
    secrets: inherit
