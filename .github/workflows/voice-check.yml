# Score the voice-design takes off-PC (the home PC has no memory to spare while the drama render runs):
# pitch band, Whisper letter match, pace and pauses; builds the blind listening page. Takes come from a voice-design run.
name: voice-check
on:
  workflow_dispatch:
    inputs:
      run_id: {description: voice-design run id, required: true}
  push:
    branches: [claude/voice-design]
    paths: [tools/check_story.py, .github/workflows/voice-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || '45331004289' }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q openai-whisper librosa soundfile numpy
      - run: gh run download "$RUN_ID" -n voice-design -D cand
      - run: python tools/check_story.py cand blind
      - uses: actions/upload-artifact@v4
        with:
          name: voice-check
          path: |
            cand/check.json
            blind
          retention-days: 7
