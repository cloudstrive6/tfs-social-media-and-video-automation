# Shared job: runs one `tfs` command with exactly the secrets the pipeline uses, mapped by name.
# Every other workflow calls this with `secrets: inherit`; nothing ever dumps all secrets at once.
name: run
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      needs_claude:
        description: install the Claude Code CLI (agents run through it on the Max subscription)
        required: false
        type: boolean
        default: false
      needs_media:
        description: install ffmpeg + fonts (rendering)
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TFS_DATA_DIR: ${{ github.workspace }}/data
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_VOICE_JUAN: ${{ secrets.ELEVENLABS_VOICE_JUAN }}
      ELEVENLABS_VOICE_TITO_TRAPO: ${{ secrets.ELEVENLABS_VOICE_TITO_TRAPO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
      POSTFORME_API_KEY_TIKTOK: ${{ secrets.POSTFORME_API_KEY_TIKTOK }}
      POSTFORME_ACCOUNT_TIKTOK: ${{ secrets.POSTFORME_ACCOUNT_TIKTOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      TFS_COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: inputs.needs_media
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - if: inputs.needs_claude
        run: curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pip install -q -e .
      - run: python -m tfs.cli $TFS_COMMAND
